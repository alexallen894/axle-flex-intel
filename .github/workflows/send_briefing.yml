name: Send Axle Flex Intel Briefing

on:
  push:
    branches: [main]
    paths:
      - email_body.html
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          echo "API key set: $([ -n "$RESEND_API_KEY" ] && echo YES || echo NO)"
          echo "API key prefix: ${RESEND_API_KEY:0:8}..."
          SUBJECT="Axle Flex Intel | 28 May 2026 | Wind at 45% but 61% of periods tight-margin — flex demand is structural"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"Axle Flex Intel <onboarding@resend.dev>\",\"to\":[\"alex.allen894@gmail.com\"],\"subject\":\"$SUBJECT\",\"html\":$(python3 -c 'import json,sys; print(json.dumps(open("email_body.html").read()))')}" \
            https://api.resend.com/emails)
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "HTTP status: $HTTP_STATUS"
          echo "Response: $BODY"
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "::error::Resend failed with HTTP $HTTP_STATUS: $BODY"
            exit 1
          fi
