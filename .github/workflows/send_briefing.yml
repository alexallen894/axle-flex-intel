name: Send Axle Flex Intel Briefing

on:
  push:
    branches: [main]
    paths:
      - email_body.html
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.error, sys, os

          api_key = os.environ["RESEND_API_KEY"]
          html = open("email_body.html").read()

          # Extract subject from the <title> tag as fallback, but use a fixed subject
          subject = "Axle Flex Intel | 28 May 2026 | Wind at 45% but 61% of periods tight-margin — flex demand is structural"

          # Try to read subject from relay Gist if available
          try:
              import urllib.request as ur
              TOKEN = os.environ.get("GITHUB_TOKEN", "")
              req = ur.Request(
                  "https://api.github.com/gists/37d486f1c0d3e65a374fa1c9f7cdd6bf",
                  headers={"Authorization": f"token {TOKEN}", "Accept": "application/json"}
              )
              with ur.urlopen(req, timeout=10) as r:
                  gist_data = json.loads(r.read())
                  content = gist_data["files"]["email_output.json"]["content"]
                  email_json = json.loads(content)
                  subject = email_json.get("subject", subject)
                  print(f"Using subject from Gist: {subject}")
          except Exception as e:
              print(f"Could not read Gist subject, using default: {e}")

          payload = json.dumps({
              "from": "Axle Flex Intel <onboarding@resend.dev>",
              "to": ["alex.allen894@gmail.com"],
              "subject": subject,
              "html": html,
          }).encode()

          req = urllib.request.Request(
              "https://api.resend.com/emails",
              data=payload,
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  result = json.loads(r.read())
                  print(f"Email sent. Resend ID: {result.get('id')}")
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"Failed: HTTP {e.code} — {body}")
              sys.exit(1)
          except Exception as e:
              print(f"Failed: {e}")
              sys.exit(1)
          EOF
