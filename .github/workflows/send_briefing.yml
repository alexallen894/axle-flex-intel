name: Send Axle Flex Intel Briefing

on:
  push:
    branches: [main]
    paths:
      - email_body.html
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          echo "API key set: $([ -n "$RESEND_API_KEY" ] && echo YES || echo NO)"
          echo "API key prefix: ${RESEND_API_KEY:0:8}..."
          python3 - <<'PYEOF'
import json, urllib.request, urllib.error, sys, os

api_key = os.environ.get("RESEND_API_KEY", "")
if not api_key:
    print("ERROR: RESEND_API_KEY is empty", flush=True)
    sys.exit(1)

html = open("email_body.html").read()
subject = "Axle Flex Intel | 28 May 2026 | Wind at 45% but 61% of periods tight-margin — flex demand is structural"

payload = json.dumps({
    "from": "Axle Flex Intel <onboarding@resend.dev>",
    "to": ["alex.allen894@gmail.com"],
    "subject": subject,
    "html": html,
}).encode("utf-8")

req = urllib.request.Request(
    "https://api.resend.com/emails",
    data=payload,
    headers={"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"},
    method="POST",
)
try:
    with urllib.request.urlopen(req, timeout=15) as r:
        result = json.loads(r.read())
        print(f"Email sent. Resend ID: {result.get('id')}", flush=True)
except urllib.error.HTTPError as e:
    body = e.read().decode()
    print(f"::error::Resend HTTP {e.code}: {body}", flush=True)
    sys.exit(1)
except Exception as e:
    print(f"::error::{e}", flush=True)
    sys.exit(1)
PYEOF
