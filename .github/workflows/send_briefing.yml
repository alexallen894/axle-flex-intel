name: Send Axle Flex Intel Briefing

on:
  push:
    branches: [main]
    paths:
      - email_body.html
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 send_briefing_action.py
